# yaml-language-server: $schema=https://dataquail.github.io/goodbones/schema/architecture-node.schema.json
#
# @org/server — the Nest BFF. One node rather than four siblings, so the taxonomy
# has a single root, the naming convention is stated once, and a folder nobody
# declared is a violation rather than a gap.
#
# One node of the architecture policy: the root architecture.yaml includes this
# file at "~/server/src/". Patterns are repo-relative and use the root's
# aliases; a fragment defined under `defs` here joins the one namespace every file
# shares, so name it for what it is.

defs:
  # ── server ────────────────────────────────────────────────────────────
  # The four kinds of server test, told apart by what they may name. A test
  # that needs more than its kind grants is a test of the next kind, and is
  # named so — the filename stem is what picks the kind.
  server-unit-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A unit test names its subject, anything else inside the server (fakes, test-utils),
        vitest, oxide and node's assert — nothing else. No bus, no unit of work, no database,
        no contracts: a test that needs a unit of work is a use-case test, one that needs the
        database is an integration test.
      external: [vitest]
      allow: ["node:**", "@/**"]

  server-use-case-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        A use-case test constructs a handler, adapter or policy over fakes, the recording event
        bus and PassThroughUnitOfWork, so it names the two application libraries' testing
        entries beside what a unit test may. Still no database and no contracts.
      external: [vitest, oxide.ts]
      allow: ["node:**", "@/**", "~/event-bus/**", "~/unit-of-work/**"]

  server-integration-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        An integration test seeds and reads the test database, so it names @org/database beside
        what a unit test may. It asserts on rows and read models, not on the contracts — that
        is the endpoint test's job.
      external: [vitest]
      allow: ["node:**", "@/**", "~/database/**"]

  server-unit-of-work-test-file:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        An integration test that builds its own unit of work over the test database rather
        than taking the test server's: the unit-of-work test itself, and an event adapter
        driven inside a transaction the test opens.
      external: [vitest, oxide.ts, zod]
      allow: ["node:**", "@/**", "~/event-bus/**", "~/unit-of-work/**", "~/database/**"]

  # The constituent operations bags: domain-private invariant logic on an
  # aggregate's internals, each owing a sibling test.
  constituent-ops:
    message: >-
      A constituent operations bag (*.entity-ops.ts / *.aggregate-ops.ts / *.value-object-ops.ts)
      is domain-private invariant logic; add the sibling *.<stereotype>.test.ts.
    requires: ["{base}.test.ts"]
    importedBy:
      message: >-
        ADR-0003: *.entity-ops.ts / *.aggregate-ops.ts / *.value-object-ops.ts encode invariants
        on an aggregate's internals. They are domain-private — only the module's own domain/ may
        compose them, and nothing outside domain/ may touch them. Mutate the aggregate only through
        its root: a command, query, adapter or infrastructure file reaching for a constituent op is
        bypassing the root.
      allow: ["@/modules/*/domain/**", "**/*.test.ts"]

  specification:
    message: >-
      A specification (*.specification.ts) is a named domain predicate over an aggregate; add the
      sibling *.specification.test.ts.
    requires: ["{base}.test.ts"]

  # What a handler file may export: one handler class, named for its use case
  # (ADR-0024). The count is over `*Handler` rather than over every export so a
  # handler may still publish a transaction-free core for a sibling that has to
  # run it inside its own unit of work.
  one-handler-export:
    message: >-
      A handler file exports exactly one handler class, named `<Name>Handler` (ADR-0024). A
      second handler here is a second use case that wants its own file; none means this is not
      a handler.
    declares: [class]
    match: "*Handler"
    count: { min: 1, max: 1 }
  camel-case-value-exports:
    message: >-
      A handler's value exports are camelCase — `{name}` is not (ADR-0024). The handler is the
      one class; a helper it publishes (a transaction-free core, a row-to-view mapper) is a
      camelCase function.
    declares: [function, variable]
    convention: camelCase

  # A port is a declaration: the shape, and the abstract class that is its DI
  # token. A value beside them is an implementation, which lives behind the port.
  port-declares-no-value:
    message: >-
      A port declares a shape and the abstract class that names it as a token — types and that
      class. `{name}` is a value: an implementation belongs in infrastructure/ behind the port,
      and a helper that operates on the port's input is a domain service or an aggregate op.
    declares: [function, variable]

  # A port is consumed by its module's own use cases and by the adapter that
  # implements it. Stated here rather than as a distant rule whose `from` side
  # grows an exclusion for every new caller.
  port-consumers:
    message: >-
      An outbound port (domain/ports/clients/, domain/ports/repositories/) is consumed by the
      module's own use cases, the @Module() that binds its adapter, and the infrastructure
      adapter that implements it — nothing else. A policy, an endpoint or another module
      reaching for one is bypassing the use-case boundary: dispatch a command or query instead.
      ACL ports are a separate case with their own rule.
    allow:
      - "@/modules/*/domain/**"
      - "@/modules/*/commands/**"
      - "@/modules/*/queries/**"
      - "@/modules/*/event-handlers/**"
      - "@/modules/*/sagas/**"
      - "@/modules/*/infrastructure/**"
      - "@/modules/*/*.module.ts"
      - "@/modules/*/*.platform.ts"
      - "@/platform/modules/**"
      - "@/test-utils/**"
      - "**/*.test.ts"

  # An ACL port has one consumer the other tiers do not: a policy. A check takes
  # its data source as an argument and the module's contribution closes over this
  # port, so `policies/` names it directly (ADR-0021, ADR-0022).
  acl-port-consumers:
    message: >-
      An ACL port (domain/ports/acl/) is consumed by the module's own use cases, its policies (a
      check takes its data source as an argument, and the module's contribution closes over this
      port), the @Module() that binds its adapter, and the infrastructure adapter that
      implements it — nothing else.
    allow:
      - "@/modules/*/domain/**"
      - "@/modules/*/commands/**"
      - "@/modules/*/queries/**"
      - "@/modules/*/event-handlers/**"
      - "@/modules/*/sagas/**"
      - "@/modules/*/infrastructure/**"
      - "@/modules/*/*.module.ts"
      - "@/test-utils/**"
      - "**/*.test.ts"
      - "@/modules/*/policies/**"

  # The inbound-adapter floor: what an HTTP or CLI endpoint may name. Stated
  # once so the two protocol folders cannot drift apart.
  endpoint-imports:
    reset: true
    message: >-
      An inbound adapter translates the wire into a use case: it may name its own module's
      commands, queries and policies, the contracts it implements, the platform's HTTP, auth and
      CQRS surface, the guard, and a module-owned client its endpoints consume. It may not reach
      its own repositories or aggregate ops directly — that is what the use case in the middle
      is for — nor another module's internals.
    external: ["@nestjs/common", cookie, express, zod]
    allow:
      - "@/common/env-vars.ts"
      - "@/platform/auth/**"
      - "@/platform/cqrs/command-bus.ts"
      - "@/platform/cqrs/query-bus.ts"
      - "@/platform/http/**"
      - "@/platform/middlewares/user-auth.guard.ts"
      - "@/platform/ids/**"
      - "@/modules/{module}/commands/*.command.ts"
      - "@/modules/{module}/queries/*.query.ts"
      - "@/modules/{module}/policies/**"
      - "@/modules/{module}/interface/**"
      - "@/modules/{module}/domain/*/*.id.ts"
      - "@/modules/{module}/domain/*/*.root.ts"
      - "@/modules/{module}/infrastructure/clients/*.client.ts"
      - "~/contracts/**"

  endpoint-test-imports:
    surface: [{ use: test-exports-nothing }]
    imports:
      reset: true
      message: >-
        An endpoint test exercises the contract over real HTTP against the test server's
        database, so it names @org/database and the server test runtime beside what a unit test
        may; the typed client comes from test-utils. A client fake it reads back is the one
        adapter a composition root swaps.
      external: [vitest, zod]
      allow: ["node:**", "@/**", "~/database/**"]

message: >-
  packages/server/src holds main.ts and instrumentation.ts (the process entrypoints), common/
  (leaf utilities), platform/ (the cross-cutting kernel), modules/ (the feature modules) and
  test-utils/ (the test harness). A new folder here is a new tier — declare it deliberately.
name: kebab-case
surface:
  # vitest loads a globalSetup by its default export.
  - use: no-default-exports
    except: ["**/vitest.config.ts", "@/test-utils/global-setup.ts"]
  - message: >-
      No `export *` in the server. A star re-export republishes every name of its target, which
      is how a symbol one restriction fences to composition roots gets laundered through a
      barrel nobody reads. Re-export by name. The one exemption is the DDD contracts tier, which
      re-exports a whole domain-safe library module on purpose.
    kinds: [namespace]
    except: ["@/platform/ddd/contracts/domain-event.ts"]
children:
  "main.ts":
    imports:
      # A composition root names everything by design; an allowlist here could
      # only be "the whole repo", which is a rule that can never fire.
      unrestricted: true
    importedBy:
      message: >-
        main.ts is the process entrypoint: it composes and starts the Nest application as a side
        effect of being loaded, so importing it either duplicates the composition or drags the
        whole dependency graph into a cycle. Nothing imports it. A test that needs the composed
        application builds one from test-utils/test-server.ts over the same AppModule.
      allow: []
  "instrumentation.ts":
    imports:
      reset: true
      message: >-
        instrumentation.ts is loaded with --import before the application, so it names the
        OpenTelemetry SDK and nothing of the application.
      external:
        - "@opentelemetry/sdk-node"
        - "@opentelemetry/auto-instrumentations-node"
        - "@opentelemetry/exporter-trace-otlp-http"
      allow: []
    importedBy:
      message: "instrumentation.ts is a --import preload; nothing imports it."
      allow: []

  # ── common/ ───────────────────────────────────────────────────────────
  # Leaf utilities every tier may reach: the typed environment and the Nest
  # module that provides it. Being reachable from everywhere is exactly why
  # this has to stay the narrowest thing in the repo.
  "common/":
    message: >-
      common/ holds leaf utilities with no architectural position: the typed environment and
      the global module that provides it. A file here is reachable from every tier, so it may
      depend on nothing but zod, Nest's DI and the node builtins. Anything that needs more than
      that is not common — it belongs to a tier that can name its dependencies.
    imports:
      message: >-
        A common/ file may name zod, Nest's DI, the node builtins and its own siblings. Nothing
        else — not the contracts package, not the database, not a module, not the platform.
        That is the whole reason it is safe to reach from anywhere.
      external: [zod, "@nestjs/common"]
      allow: ["@/common/**"]
    children:
      "env-vars.ts": {}
      "env.module.ts": {}
      "*.test.ts": { use: server-unit-test-file }

  # ── platform/ ─────────────────────────────────────────────────────────
  # The cross-cutting kernel every module sits on. Each tier states its own
  # dependencies, so the `@/platform/**` the modules are granted is a set of
  # tiers that each say what they are.
  "platform/":
    message: >-
      platform/ holds the cross-cutting kernel: branded IDs, the DDD contracts tier, the buses,
      the database binding, the HTTP plumbing, the auth and notification ports, the persistence
      helpers, and the composition modules. A file here is shared by every module, so it earns
      its place by being needed by more than one.
    imports:
      message: >-
        A top-level platform file is infrastructure for the whole server: it may name the
        environment, its own siblings, the contracts package and the database kernel. It must
        not reach into a module.
      external: [oxide.ts]
      allow: ["~/database/**", "~/unit-of-work/**"]
    children:
      "translate-database-errors.ts": {}
      "*.integration.test.ts": { use: server-unit-of-work-test-file }

      # The one tier the domain may name, so the one that must stay smallest.
      "ids/":
        message: >-
          platform/ids/ is the minimal shared kernel for cross-module branded entity IDs
          (ADR-0002).
        imports:
          reset: true
          message: >-
            platform/ids/ may only depend on zod. Column types, contract schemas and the like do
            not belong here — they leak module-internal shape into the one thing every module's
            domain is allowed to name.
          external: [zod]
          allow: []
        # Dash, not dot: platform's shared IDs are `user-id.ts`, where a
        # module's own are `todo.id.ts`.
        children:
          "*-id.ts": {}

      "ddd/":
        message: >-
          platform/ddd/ re-imbues DDD vocabulary on the event-bus and unit-of-work libraries and
          publishes their DI tokens. contracts/ is the domain-safe tier; the tokens sit
          deliberately outside it.
        imports:
          reset: true
          message: >-
            A DDD token names the library whose type it re-imbues and nothing else.
          external: []
          allow: ["~/event-bus/**", "~/unit-of-work/**"]
        children:
          "contracts/":
            message: >-
              platform/ddd/contracts/ is the only part of the kernel a module's domain/ may
              import (ADR-0006): the tagged-error base, the specification kit, and the
              domain-safe re-exports of the event-bus and unit-of-work libraries under this
              application's vocabulary. The buses and the unit of work are deliberately NOT
              among them, which is what keeps a bus out of a domain port's reach.
            imports:
              reset: true
              message: >-
                The contracts tier names the two library modules it re-exports and its own
                siblings. Anything else here would become reachable from every module's domain.
              external: []
              allow: ["~/event-bus/**", "~/unit-of-work/**"]
            children:
              "domain-event.ts": {}
              "persistence-unavailable.ts": {}
              "specification.ts": {}
              "tagged-error.ts": {}
              "*.test.ts": { use: server-unit-test-file }
          # One level outside contracts/, and that placement is the rule: it is
          # what keeps the bus out of reach of the domain.
          "event-bus.ts": {}
          "unit-of-work.ts": {}
          "unhandled-failures.ts": {}

      # The typed database client token and the transaction driver that binds
      # the unit of work to it: the one file that knows a unit of work is a
      # database transaction.
      "database/":
        message: >-
          platform/database/ holds the Database token, the global module that provides it from
          the environment, and the transaction driver the unit of work runs on.
        imports:
          reset: true
          message: >-
            The database binding names the database kernel, the unit-of-work driver contract,
            the environment and Nest's DI. Nothing from a module.
          external: ["@nestjs/common"]
          allow: ["@/common/**", "@/platform/database/**", "~/database/**", "~/unit-of-work/**"]
        children:
          "database.ts": {}
          "database.module.ts": {}
          "transaction-driver.ts": {}

      # A composition root, and the one place in platform/ that names every
      # module — through their platform surfaces.
      "cqrs/":
        message: >-
          platform/cqrs/ builds the slice of the runtime that production and the test harness
          share verbatim: the span-opening command and query buses over Nest's, the one domain
          event bus, the unit of work and the unhandled-failure sink. It is a composition root,
          which is why the bus factories are reachable here and nowhere else.
        imports:
          reset: true
          message: >-
            The CQRS runtime folds every module's span-attribute tables into one and builds the
            event bus and unit of work over the database binding, so it names each module
            through its platform surface, Nest's CQRS, the two libraries and the DDD tokens. It
            reaches no module internals.
          external: ["@nestjs/common", "@nestjs/cqrs", "@opentelemetry/api"]
          allow:
            - "@/modules/*/*.platform.ts"
            - "@/platform/cqrs/**"
            - "@/platform/database/**"
            - "@/platform/ddd/**"
            - "~/event-bus/**"
            - "~/unit-of-work/**"
        children:
          "command-bus.ts": {}
          "query-bus.ts": {}
          "messages.ts": {}
          "cqrs-runtime.ts": {}
          "*.test.ts": { use: server-use-case-test-file }

      # The other half of the composition root: platform/cqrs/ folds the
      # modules' dispatch tables, this names the modules those tables route
      # and builds the registries every composition root builds identically.
      "modules/":
        message: >-
          platform/modules/ names the application's modules once, as AppModule, and holds the
          two global modules every composition root builds identically: the authorizer over the
          folded policy and resolver registries, and the billing gateway binding a root swaps.
        imports:
          reset: true
          message: >-
            The module registry names each module through its platform surface, the authz
            library it folds the registries with, and the platform modules it assembles. It
            reaches no module internals.
          external: ["@nestjs/common", "@nestjs/core"]
          allow:
            - "~/authz/**"
            - "@/modules/*/*.platform.ts"
            - "@/common/**"
            - "@/platform/auth/**"
            - "@/platform/cqrs/**"
            - "@/platform/database/**"
            - "@/platform/http/**"
            - "@/platform/middlewares/**"
            - "@/platform/modules/**"
            - "@/platform/notifications/**"
        children:
          "application-modules.ts": {}
          "*.module.ts": {}

      "auth/":
        message: >-
          platform/auth/ is the only server-side authorization configuration: the action
          vocabulary, the four host types the authz library does not own, the authorizer, the
          Authenticator port the guard resolves callers through, the caller decorator and the
          session cookie codec.
        imports:
          reset: true
          message: >-
            The auth kernel names the authz library it configures, the contracts that define
            the caller, the HTTP problem it raises on denial, its own siblings and the
            environment. It must not reach into a module.
          external: ["@nestjs/common", express]
          allow:
            [
              "node:**",
              "@/platform/auth/**",
              "@/platform/http/**",
              "@/common/**",
              "~/contracts/**",
              "~/authz/**",
              "~/unit-of-work/**",
            ]
        children:
          "actions.ts": {}
          "authz.ts": {}
          "authenticator.ts": {}
          "caller.decorator.ts": {}
          "cookie-codec.ts": {}
          "*.test.ts": { use: server-unit-test-file }

      # The HTTP plumbing every endpoint speaks: the route decorator bound to a
      # contract, the zod pipe, the problem type and the filter that writes it.
      "http/":
        message: >-
          platform/http/ holds the contract-bound endpoint decorator, the zod pipe, the
          HttpProblem every failure leaves as, the filter that serialises it, and the OpenAPI
          controller. It names the contracts and Nest — never a module.
        imports:
          reset: true
          message: >-
            The HTTP plumbing names Nest, express types, zod, oxide, the contracts package and
            the unit-of-work failure it translates. Nothing from a module.
          external: ["@nestjs/common", express, zod, oxide.ts]
          allow: ["@/platform/http/**", "~/contracts/**", "~/unit-of-work/**"]
        children:
          "endpoint.ts": {}
          "http-problem.ts": {}
          "problem.filter.ts": {}
          "openapi.controller.ts": {}
          "*.test.ts": { use: server-unit-test-file }

      "notifications/":
        message: >-
          platform/notifications/ holds the Mailer port, its errors, the transports that
          satisfy it and the global module that picks one. The transport SDKs are enumerated
          here because this is the tier whose job is to have them.
        imports:
          reset: true
          message: >-
            A notification transport names its port, its sibling transports, the environment
            and its own SDK. Adding a transport means adding its SDK to this list, in the open.
          external: ["@nestjs/common", oxide.ts, "@aws-sdk/client-sesv2", nodemailer]
          allow: ["@/platform/notifications/**", "@/platform/ddd/contracts/**", "@/common/**"]
        children:
          "mailer.ts": {}
          "mail-errors.ts": {}
          "notifications.module.ts": {}
          "*-live.ts": {}
          "*.test.ts": { use: server-unit-test-file }

      "middlewares/":
        message: >-
          platform/middlewares/ holds the guard every private endpoint names and the
          Authenticator that resolves a credential through the auth module — the one part of
          the kernel that legitimately names a module, and only through its platform surface.
        imports:
          reset: true
          message: >-
            The guard names only the Authenticator port, because every endpoint names the guard
            at decoration time and the auth module's own endpoints are among them. The
            Authenticator's live resolves the caller before any endpoint runs, so it names the
            auth module through its platform surface — never past it — plus the buses, the
            cookie codec, the contracts that define the caller, and the environment.
          external: ["@nestjs/common", cookie]
          allow:
            - "@/common/**"
            - "@/platform/auth/**"
            - "@/platform/cqrs/command-bus.ts"
            - "@/platform/cqrs/query-bus.ts"
            - "@/platform/http/**"
            - "@/modules/*/*.platform.ts"
            - "~/contracts/**"
        children:
          "*.guard.ts":
            imports:
              deny:
                - match: "@/modules/**"
                  message: >-
                    The guard is named at decoration time by every private endpoint, the auth
                    module's own among them, so a module surface named here is an import cycle
                    at load. It depends on the Authenticator port; the live behind that port is
                    the file that names the auth module.
          "*-live.ts": {}
          "*.test.ts": { use: server-unit-test-file }

      "persistence/":
        message: >-
          platform/persistence/ turns the specification kit into SQL. It is the seam between a
          domain predicate and a query, so it names the contracts tier and the sql tag, and
          nothing from a module.
        imports:
          reset: true
          message: >-
            The persistence helpers name the specification kit they compile and the database
            kernel's sql tag. No modules.
          external: []
          allow: ["@/platform/ddd/contracts/**", "~/database/**"]
        children:
          "criteria-to-sql.ts": {}
          "*.test.ts": { use: server-unit-test-file }

  # ── modules/ ──────────────────────────────────────────────────────────
  "modules/{module}/":
    message: >-
      The module root admits only aggregation files, each named for the plane it serves
      (ADR-0024): <feature>.platform.ts (what the platform names), <feature>.exports.ts (what a
      peer names), <feature>.imports.ts (what this module takes from other modules),
      <feature>.module.ts (the Nest module), <feature>.command-handlers.ts /
      .query-handlers.ts (the handler and message lists plus their span attributes),
      <feature>.event-span-attributes.ts, and <feature>.handlers.test.ts (boot completeness).
      Feature code belongs in a stereotype subfolder (domain/, commands/, queries/,
      event-handlers/, sagas/, infrastructure/, interface/, policies/).

    importedBy:
      message: >-
        Files outside src/modules/ must import a module through its <feature>.platform.ts
        surface. A module is private except for what it publishes on purpose — reaching past
        that file couples you to a shape the module is free to change without telling you.
      allow: ["@/modules/**", "**/*.test.ts"]
      # The platform surface is itself public, so the restriction does not cover it.
      matchNot: ["*.platform.ts"]

    imports:
      message: >-
        A module's aggregation files compose it: *.module.ts assembles the Nest module, the
        *-handlers.ts lists register handlers on the bus and publish the span attributes. They
        may name anything inside their own module — including its adapters, which is the whole
        point — plus the DDD vocabulary and the bus types. They may not reach another module's
        internals, the database, or the contracts package.
      external: ["@nestjs/common"]
      allow:
        - "@/modules/{module}/**"
        - "@/platform/cqrs/command-bus.ts"
        - "@/platform/ddd/**"
      deny:
        - match: ["@/platform/**/*-live.ts", "@/platform/**/*.module.ts"]
          except: ["@/main.ts", "@/platform/**", "@/test-utils/**", "**/*.test.ts"]
          message: >-
            A Live is bound at a composition root, never named by a use case (ADR-0007). Depend
            on the port's abstract class; the binding that satisfies it is assembled in
            platform/modules/, platform/cqrs/cqrs-runtime.ts or test-utils/.
        # Module-wide, so it holds for tiers that carry no allowlist too.
        - match: "@/modules/*/**"
          matchNot:
            - "@/modules/{module}/**"
            - "@/modules/*/*.platform.ts"
            - "@/modules/*/*.exports.ts"
            - "@/modules/*/*.module.ts"
          message: >-
            A module may only import another module through one of the three files it
            publishes on purpose: <feature>.exports.ts for its peers, <feature>.platform.ts for
            the platform, <feature>.module.ts for another module's wiring. Reaching anywhere
            else couples you to a shape it is free to change.
        - match: "@/modules/*/*.platform.ts"
          matchNot: ["@/modules/{module}/*.platform.ts"]
          except: ["**/*.test.ts"]
          message: >-
            A module may not name another module's <feature>.platform.ts: that is the platform
            surface, for the composition roots and the platform. Reach <feature>.exports.ts instead — and
            only from a cross-context ACL adapter (infrastructure/acl/) or an inbound event
            adapter (interface/events/). Everywhere else depends on a consumer-owned port in
            domain/ports/acl/, whose adapter is the one place the foreign vocabulary appears
            (ADR-0022). A client that reaches into a sibling module is a miscategorised ACL.

    children:
      "*.platform.ts":
        importedBy:
          message: >-
            <feature>.platform.ts is the PLATFORM surface: what the platform names to assemble
            and drive this module — its message lists, its span attributes, its Nest module,
            its policy contribution and resolver entries, and the messages the auth guard
            dispatches. Only the composition roots and the platform kernel may reach it. A peer
            module wanting this module's vocabulary reaches <feature>.exports.ts instead, which
            is the surface published for that purpose; reaching in here couples a module to how
            the application is wired.
          allow:
            - "@/main.ts"
            - "@/platform/**"
            - "@/test-utils/**"
            - "**/*.test.ts"
        surface:
          - message: >-
              <feature>.platform.ts re-exports; `{name}` is declared here. It is the surface the
              module publishes to the platform, not a home for code — move the declaration into
              the stereotype folder that owns it and re-export it from there.
            reexport: false
        imports:
          reset: true
          message: >-
            <feature>.platform.ts re-exports from its own module and nowhere else: domain types,
            message definitions, handler lists and the module's Nest module. It is the surface
            the platform sees, so anything it names becomes public.
          allow: ["@/modules/{module}/**"]
          deny:
            - match: ["@/modules/*/infrastructure/**", "@/modules/*/interface/**"]
              # The one publishable adapter: a third-party client's live/fake pair,
              # which a composition root picks between the way it picks a database
              # or a transport. A repository has no such choice — the environment
              # varies the database, not the repository — and interface/ is inbound.
              matchNot:
                - "@/modules/*/infrastructure/clients/*.client-live.ts"
                - "@/modules/*/infrastructure/clients/*.client-fake.ts"
              message: >-
                <feature>.platform.ts publishes domain types, message definitions, handler lists
                and the module's Nest module — never its adapters, with one exception: a
                third-party client's live/fake pair, because choosing between those is a
                composition root's job. Re-exporting anything else from infrastructure/ or
                interface/ makes a driven or driving adapter part of the module's public
                surface, which is exactly what this file exists to keep private.
      # The inbound gateway on the coupling plane, and the mirror of
      # *.exports.ts. A Nest module is not here: needing one is a fact about
      # how the application is assembled, and assembly talks to assembly on
      # its own plane. This file is the answer to "what vocabulary does this
      # module depend on", and the one file a reviewer watches for a widening.
      "*.imports.ts":
        imports:
          message: >-
            <feature>.imports.ts names another module's <feature>.exports.ts and nothing else of
            that module's. It is the only file here allowed to, which is what makes it a gateway
            rather than a convention. A foreign Nest module is not vocabulary —
            <feature>.module.ts names another module's <feature>.module.ts for that.
          allow:
            - "@/modules/*/*.exports.ts"
        importedBy:
          message: >-
            <feature>.imports.ts is this module's own inventory of what it takes from other
            modules. Its own files read it; a peer reaching for it would be depending on a third
            module through this one, which the module-wide prohibition refuses.
          allow: ["@/modules/*/**", "**/*.test.ts"]

      "*.module.ts":
        imports:
          message: >-
            <feature>.module.ts imports the Nest modules of the modules it reaches, so it names
            their <feature>.module.ts: the wiring plane talking to the wiring plane. It is the
            only file here allowed to. The vocabulary this module couples to arrives through
            <feature>.imports.ts instead, and does not belong in an assembly file.
          allow:
            - "@/modules/*/*.module.ts"
        importedBy:
          message: >-
            <feature>.module.ts is the WIRING plane: it holds the module's Nest module, and the
            only thing that needs it is other wiring. Another module's <feature>.module.ts may
            name it, to import a module it reaches, and this module's own <feature>.platform.ts
            publishes it to the platform. A consumer's <feature>.imports.ts may not: that file
            is the coupling plane, and a Nest module is not vocabulary. Application code — a
            command, a query, a policy, an ACL or event adapter — reaches <feature>.exports.ts
            instead.
          allow:
            - "@/modules/*/*.module.ts"
            - "@/modules/*/*.platform.ts"
            - "**/*.test.ts"
      # The module's peer-facing surface, stated apart from its wiring. What a
      # peer names rather than resolves. Omitting the file is not the same as
      # an empty one — write it, so a widening shows up in review.
      "*.exports.ts":
        importedBy:
          message: >-
            <feature>.exports.ts is the PEER surface: the vocabulary another module is actually
            coupled to. Only the two anti-corruption seams may reach it — a cross-context ACL
            adapter (infrastructure/acl/) or an inbound event adapter (interface/events/) —
            through their own module's <feature>.imports.ts. Everywhere else in a consumer
            depends on a consumer-owned port in domain/ports/acl/, whose adapter is the one
            place the foreign vocabulary appears (ADR-0022). A module's Nest module is
            deliberately absent: needing it is a fact about how this application is wired, not
            about what one bounded context asks of another, and it is reached on the wiring
            plane instead.
          allow:
            - "@/modules/*/*.imports.ts"
            - "**/*.test.ts"
        surface:
          - message: >-
              What the peer surface declares is named `<module>Access<Queries|Commands|DomainEvents|Errors>`
              — `{name}` is not. One shape across every module, so a consumer's import line says
              which context it is reaching and whether it is asking or telling, and a second
              subset for a second consumer is a rename rather than a new vocabulary. A domain
              event a peer may subscribe to, and an error from a published failure channel that
              a peer has to name to translate, are each collected into their object rather than
              re-exported loose, so every grant is one name. The prefix is held to a shape, not
              to this module's own name: a surface matcher does not interpolate the {module}
              capture, so `roleAccessQueries` declared in user/ passes here and is caught by
              reading the import line.
            kinds: [named]
            reexport: false
            convention: { regex: "^[a-z][a-zA-Z0-9]*Access(Queries|Commands|DomainEvents|Errors)$" }
            probe:
              source: "export const zzPeerQueries = 1;"
          - message: >-
              <feature>.exports.ts declares its grants; `{name}` is a bare re-export, which
              publishes whatever the origin file happens to export, under whatever name it
              happens to use, and slips past the naming rule above. Collect it into the
              <module>Access<...> object that names the grant. A peer that needs the type takes
              it off the published value — InstanceType<typeof userAccessErrors.UserAlreadyExists>
              — and a type-only re-export is not exempted because the extractor cannot tell one
              from a value re-export, so admitting either admits both.
            kinds: [named]
            reexport: true
            probe:
              source: 'export { ZzThing } from "./zz.js";'
      "*.command-handlers.ts | *.query-handlers.ts": {}
      "*.event-span-attributes.ts": {}
      "*.handlers.test.ts": { use: server-unit-test-file }

      "commands/":
        message: >-
          commands/ holds a <verb-noun>.command.ts message and its <verb-noun>.handler.ts
          handler class. A shared helper here is a smell — domain logic belongs on an aggregate
          op (ADR-0023), trivial logic inlines.

        imports:
          reset: true
          message: >-
            Module commands (write-side use cases) may only import: their own module's domain
            and sibling commands, Nest's CQRS (the Command base class and the handler decorator
            — ADR-0006) and DI, oxide, the DDD tokens under platform/ddd/ (UnitOfWork, the event
            bus, the contracts tier) and platform/ids/. Mail goes through a client port in the
            module's own domain/ports/clients/, never the platform Mailer directly. No
            platform Live (adapters are bound in a @Module()), no infrastructure, no interface,
            no queries, no event-handlers, no @org/contracts (a command's failure channel names
            domain errors; the endpoint maps them to wire errors — ADR-0004), no @org/database,
            and no other module's surface — a cross-module call goes through a domain/ports/acl/
            port whose adapter lives in infrastructure/acl/ (ADR-0022).
          external: ["@nestjs/common", "@nestjs/cqrs", oxide.ts, "@opentelemetry/api"]
          allow:
            - "node:**"
            - "@/modules/{module}/domain/**"
            - "@/modules/{module}/commands/**"
            - "@/platform/ddd/**"
            - "@/platform/ids/**"

        children:
          "*.command.ts": {}
          "*.handler.ts":
            message: >-
              Every command handler (*.handler.ts) needs a sibling *.handler.test.ts (use-case
              unit test with the repository fakes).
            requires: ["{base}.test.ts"]
            surface: [{ use: one-handler-export }, { use: camel-case-value-exports }]
          "*.test.ts": { use: server-use-case-test-file }

      "queries/":
        message: "queries/ holds a <verb-noun>.query.ts message and its <verb-noun>.handler.ts handler class."

        imports:
          reset: true
          message: >-
            A query builds its own read model: it reads SQL directly through the Database token
            and @org/database's row schemas and must not cross the write-side consistency
            boundary. From its own domain/ it may take only two things — branded IDs
            (domain/<sub>/*.id.ts) and cross-context ACL ports (domain/ports/acl/, since
            ADR-0020 bans cross-schema SQL). Roots, ops, repositories, specifications, value
            objects, errors and events are off-limits; read-side errors and statuses live in
            the *.query.ts, not the domain.
          external: ["@nestjs/common", "@nestjs/cqrs", oxide.ts, zod]
          allow:
            - "@/modules/{module}/queries/**"
            - "@/modules/{module}/domain/*/*.id.ts"
            - "@/modules/{module}/domain/ports/acl/**"
            - "@/platform/ddd/contracts/**"
            - "@/platform/ids/**"
            - "@/platform/database/database.ts"
            - "@/platform/translate-database-errors.ts"
            - "~/database/**"

        children:
          "*.query.ts": {}
          "*.policy-query.ts":
            message: >-
              A *.policy-query.ts is a query this module publishes so OTHER modules'
              authorization checks can ask it a question (ADR-0022). It is a cross-module
              contract: changing its shape breaks consumers you cannot see from here, so it
              carries a stability obligation an internal *.query.ts does not. A query only this
              module dispatches is a plain *.query.ts.
          "*.handler.ts":
            message: >-
              Every query handler (*.handler.ts) needs a sibling *.handler.integration.test.ts —
              queries read real SQL projections, so the parity is on the integration test (seed
              via the live repository).
            requires: ["{base}.integration.test.ts"]
            surface: [{ use: one-handler-export }, { use: camel-case-value-exports }]
          "*.integration.test.ts": { use: server-integration-test-file }

      "event-handlers/":
        message: >-
          event-handlers/ holds one *.handler.ts per reaction (triggers live in triggers/).
          Shared logic belongs on an aggregate or domain service.
        imports:
          reset: true
          message: >-
            An event handler is a write-side use case that happens to be triggered by an event
            rather than a command, and it runs inside the publisher's unit of work (ADR-0007).
            Its dependency shape is a command's: its own module's domain, its sibling handlers,
            Nest's CQRS and DI, the DDD tokens, platform IDs and notification ports. No
            infrastructure, no interface, no queries, no @org/database, no other module's
            surface.
          external: ["@nestjs/common", "@nestjs/cqrs", oxide.ts]
          allow:
            - "node:**"
            - "@/modules/{module}/domain/**"
            - "@/modules/{module}/event-handlers/**"
            - "@/modules/{module}/commands/*.command.ts"
            - "@/platform/ddd/**"
            - "@/platform/ids/**"
            - "@/platform/notifications/**"
        children:
          "*.handler.ts":
            message: "Every event handler (*.handler.ts) needs a sibling *.handler.test.ts."
            requires: ["{base}.test.ts"]
            surface: [{ use: one-handler-export }, { use: camel-case-value-exports }]
          "*.test.ts": { use: server-use-case-test-file }
          "triggers/":
            message: >-
              event-handlers/triggers/ holds one <publisher>.triggers.ts per upstream publisher
              whose events this module reacts to.
            children:
              "*.triggers.ts": {}
              "*.test.ts": { use: server-use-case-test-file }

      "sagas/":
        message: >-
          `sagas/` holds long-running process managers only, one `*.saga.ts` per saga
          (ADR-0002, ADR-0007). A saga correlates SEVERAL eventual events over time and
          compensates when a later step fails. If one event decides the outcome, it is an
          inbound event adapter — put it in `interface/events/` instead.
        imports:
          reset: true
          message: >-
            A saga is bus-only. It may name its own module's domain events and branded IDs, its
            own commands' *.command.ts messages, its sibling sagas, the buses and the event bus
            token — no repositories, no aggregate ops, no @org/database. A saga consumes the
            post-commit stream with no publisher transaction to inherit, so a repository call
            here would write outside every unit of work.
          external: ["@nestjs/common", oxide.ts]
          allow:
            - "@/modules/{module}/domain/*/*.events.ts"
            - "@/modules/{module}/domain/*/*.id.ts"
            - "@/modules/{module}/commands/*.command.ts"
            - "@/modules/{module}/sagas/**"
            - "@/platform/cqrs/command-bus.ts"
            - "@/platform/ddd/**"
            - "@/platform/ids/**"
        children:
          "*.saga.ts":
            message: >-
              Every saga (*.saga.ts) needs a sibling *.saga.test.ts. A saga's whole value is
              behaviour across several events and over time, which is exactly what nothing else
              in the suite covers.
            requires: ["{base}.test.ts"]
          "*.test.ts": { use: server-use-case-test-file }

      "policies/":
        message: >-
          policies/ admits *.policies.ts contributions, *.resource-resolver(s).ts entries, and
          is-*.policy.ts checks. There is no policies/public/: a module does NOT publish an ACL
          service for other modules' policies to consume. Cross-module authorization data flows
          the ADR-0022 way — the module that needs the answer owns a port in domain/ports/acl/
          whose adapter dispatches the owning module's published *.policy-query.ts.
        imports:
          reset: true
          message: >-
            A policy reads read models only — never a root, a repository or a specification
            (ADR-0021). Own data comes from dispatching this module's own query on the query
            bus; foreign data comes from this module's own domain/ports/acl/ port, whose adapter
            lives in infrastructure/acl/. The authz vocabulary — the check types, Check, the
            resolver type — arrives through platform/auth/authz.ts, the one file that carries
            the AuthzConfig augmentation, so the caller and failure types are always the
            configured ones.
          external: ["@nestjs/common", oxide.ts]
          allow:
            - "@/modules/{module}/policies/**"
            - "@/modules/{module}/queries/*.query.ts"
            - "@/modules/{module}/queries/*.policy-query.ts"
            - "@/modules/{module}/domain/ports/acl/**"
            - "@/modules/{module}/domain/*/*.id.ts"
            - "@/platform/auth/authz.ts"
            - "@/platform/cqrs/query-bus.ts"
            - "@/platform/ddd/contracts/**"
            - "@/platform/ids/**"
            - "~/contracts/**"
          deny:
            - match: "~/authz/**"
              except: ["**/*.test.ts"]
              message: >-
                A policy names the authz vocabulary through @/platform/auth/authz.ts, never
                @org/authz directly. That file carries the AuthzConfig augmentation — the
                caller, the check failure, the missing-resource error and the action set — and
                the type-aware linter only sees an augmentation through the importing file's
                own import graph. Imported from the library, a check's caller is `never`.
        children:
          "*.policies.ts": {}
          "*.resource-resolver.ts | *.resource-resolvers.ts": {}
          "*.policy.ts": {}
          "*.test.ts":
            surface: [{ use: test-exports-nothing }]
            imports:
              reset: true
              message: >-
                A policy test is a use-case test that also asserts the contract error a resolver
                raises, so it names the contracts package beside what a use-case test may.
              external: [vitest, oxide.ts]
              allow: ["node:**", "@/**"]

      "infrastructure/":
        message: >-
          infrastructure/ is a container: it admits only the adapter buckets repositories/,
          clients/ and acl/, mirroring domain/ports/ (ADR-0022). No files live directly in
          infrastructure/. repositories/ holds *.repository-live.ts, *.repository-fake.ts and
          *.mapper.ts; clients/ holds third-party adapters (*.client-live.ts, *.client-fake.ts,
          a self-contained *.client.ts, *.email.tsx templates); acl/ holds *.acl-live.ts and
          *.acl-fake.ts.

        imports:
          reset: true
          message: >-
            A driven adapter implements one port. What it may reach depends on which
            counterpart it adapts to, so each bucket below states its own; this is the floor
            they share.
          external: ["@nestjs/common", oxide.ts]
          allow: ["@/platform/ids/**", "@/platform/ddd/contracts/**"]
          deny:
            - match: "@/modules/*/interface/**"
              message: >-
                The infrastructure layer must not depend on the interface layer. Both are
                adapters on opposite sides of the hexagon: inbound (interface) drives the
                application, outbound (infrastructure) is driven by it. An adapter reaching
                across is a shortcut around the use case in the middle.

        children:
          "repositories/":
            imports:
              message: >-
                A repository adapts the module's own aggregates to its own datastore. It may
                name its module's domain, its sibling repository files, the Database token, the
                persistence kernel and @org/database — and nothing else. It never reaches
                another module, the contracts package, or a third-party SDK.
              allow:
                - "@/modules/{module}/domain/**"
                - "@/modules/{module}/infrastructure/repositories/**"
                - "@/platform/database/database.ts"
                - "@/platform/persistence/**"
                - "@/platform/translate-database-errors.ts"
                - "~/database/**"
              deny:
                - match:
                    - "@/modules/*/commands/**"
                    - "@/modules/*/queries/**"
                    - "@/platform/ddd/event-bus.ts"
                    - "@/platform/cqrs/**"
                  message: >-
                    A repository is dumb persistence (ADR-0005). It must not import the module's
                    own use cases or the application-tier buses — a repository that reaches for
                    these is smuggling orchestration into persistence. Return the rows; let the
                    use case decide what they mean.
            children:
              "*.repository-live.ts": {}
              "*.repository-fake.ts": {}
              "*.mapper.ts": {}
              "*.repository-fake.test.ts | *.mapper.test.ts": { use: server-unit-test-file }
              "*.repository-live.integration.test.ts": { use: server-integration-test-file }

          "clients/":
            imports:
              message: >-
                A client adapts a true third-party system. It is the one tier whose external
                dependencies are the point, so they are enumerated here: adding an SDK is an
                edit to this list, in the open. It may also name its module's domain and client
                ports, the notification ports, the environment, and the contracts package for
                wire shapes.
              external:
                - stripe
                - openid-client
                - react
                - "@react-email/components"
                - "@react-email/render"
                - "@opentelemetry/api"
              allow:
                - "@/modules/{module}/domain/**"
                - "@/modules/{module}/infrastructure/clients/**"
                - "@/common/env-vars.ts"
                - "@/platform/notifications/**"
              deny:
                - match:
                    ["@/platform/notifications/*-live.ts", "@/platform/notifications/*.module.ts"]
                  message: >-
                    A client sends through the Mailer port, never through a transport it picks
                    itself (ADR-0007). The transport is chosen at boot from the environment.
            children:
              "*.client-live.ts": {}
              "*.client-fake.ts": {}
              "*.client.ts": {}
              "*.email.tsx": {}
              "*.test.ts | *.test.tsx":
                surface: [{ use: test-exports-nothing }]
                imports:
                  reset: true
                  message: >-
                    A client's test drives the SDK the client wraps, so it names that SDK beside
                    what a unit test may.
                  external: [vitest, oxide.ts, stripe]
                  allow: ["node:**", "@/**"]

          # The anti-corruption seam (ADR-0022): the foreign vocabulary is meant
          # to stop here. It reaches that vocabulary through its own module's
          # <feature>.imports.ts rather than naming the other module itself.
          "acl/":
            imports:
              message: >-
                An ACL adapter is the one place a module's foreign vocabulary appears
                (ADR-0022): it takes the messages the other module published from this
                module's own <feature>.imports.ts, dispatches them on the bus, and translates
                what comes back into this module's own acl port. It needs nothing else — no
                repositories, no use cases, no database, and no other module named directly.
              allow:
                - "@/modules/{module}/*.imports.ts"
                - "@/modules/{module}/domain/ports/acl/**"
                - "@/platform/cqrs/command-bus.ts"
                - "@/platform/cqrs/query-bus.ts"
            children:
              "*.acl-live.ts": {}
              "*.acl-fake.ts": {}
              "*.test.ts": { use: server-use-case-test-file }

      "interface/":
        message: >-
          interface/ is a container: it admits one subfolder per inbound protocol — http/, cli/
          and events/ (ADR-0013, ADR-0007). No files live directly in interface/. http/ and
          cli/ hold one *.endpoint.ts controller per endpoint, plus an index.ts that lists them
          and pure leaf *.util.ts helpers; events/ holds one *.event-adapter.ts per upstream
          module whose domain events this module consumes.

        children:
          "http/ | cli/":
            imports: { use: endpoint-imports }
            children:
              "index.ts": {}
              "*.endpoint.ts":
                message: >-
                  Every endpoint (*.endpoint.ts) needs a real *.endpoint.integration.test.ts
                  (ADR-0013) that exercises the HTTP layer against a live DB via
                  useServerTestRuntime.
                requires: ["{base}.integration.test.ts"]
                # The OIDC flow endpoints keep unit-token coverage: their happy
                # path needs a live IdP and is covered by Playwright plus the
                # SessionRepositoryLive integration test.
                requiresNot: ["login.endpoint.ts", "logout.endpoint.ts"]
              "*.util.ts":
                message: >-
                  An interface *.util.ts is a pure leaf helper (ADR-0023); its sibling
                  *.util.test.ts is the anti-drift guard — the extraction must be justified by a
                  unit test.
                requires: ["{base}.test.ts"]
                imports:
                  reset: true
                  message: >-
                    An interface *.util.ts is a leaf (ADR-0023): pure protocol or wire plumbing.
                    No ports, no use cases, no infrastructure, no buses, no module surface — if it
                    needs any of those it is not a util, it is the endpoint's own work or a use
                    case that has not been named yet. zod and the node builtins are all it gets.
                  external: [zod]
                  allow: []
              "*.endpoint.test.ts | *.util.test.ts": { use: server-unit-test-file }
              "*.endpoint.integration.test.ts": { use: endpoint-test-imports }

          "events/":
            message: >-
              interface/events/ holds one *.event-adapter.ts per upstream module whose domain
              events this module consumes (ADR-0007 ACL).
            imports:
              reset: true
              message: >-
                An inbound event adapter is an anti-corruption seam: it may name its own
                module's domain events and branded IDs, its own commands' *.command.ts messages,
                the upstream module's event through this module's own <feature>.imports.ts, the
                command bus it dispatches on and the event bus token it subscribes through.
                Nothing else — the foreign vocabulary stops here, translated into a command this
                module already understands.
              external: ["@nestjs/common"]
              allow:
                - "@/modules/{module}/domain/*/*.events.ts"
                - "@/modules/{module}/commands/*.command.ts"
                - "@/modules/{module}/*.imports.ts"
                - "@/platform/cqrs/command-bus.ts"
                - "@/platform/ddd/**"
                - "@/platform/ids/**"
            children:
              "*.event-adapter.ts":
                message: >-
                  Every event adapter (*.event-adapter.ts) needs a sibling
                  *.event-adapter.test.ts (ADR-0007 ACL).
                requires: ["{base}.test.ts"]
              "*.event-adapter.test.ts": { use: server-use-case-test-file }
              "*.event-adapter.integration.test.ts": { use: server-unit-of-work-test-file }

      "domain/":
        message: >-
          domain/ is a container: it admits only subdomain folders (one per
          aggregate/consistency boundary), domain-services/ (cross-subdomain domain services),
          and ports/ (clients/ + acl/). No files live directly in domain/ — put the stereotype
          inside its subdomain folder.

        # The whole of domain isolation, stated once, as an allowlist. Everything
        # a domain may not name is simply absent from here.
        imports:
          reset: true
          message: >-
            Module domain may only import from its own subdomain, zod and oxide (external), the
            DDD kernel's contracts tier (platform/ddd/contracts/), and platform/ids/ for branded
            entity IDs referenced cross-module (ADR-0002). The domain does not name Nest,
            @org/event-bus or @org/unit-of-work at all: their domain-safe modules are re-exported
            under this application's vocabulary from platform/ddd/contracts/, and the buses and
            the UnitOfWork token are deliberately NOT — admitting them here would let a
            domain/ports/ port name a bus. No contracts package, no cross-module domain, no
            infrastructure/commands/queries/event-handlers/interface.
          external: [zod, oxide.ts]
          allow: ["node:**", "@/platform/ddd/contracts/**", "@/platform/ids/**"]

        children:
          "domain-services/":
            message: >-
              domain/domain-services/ holds only *.domain-service.ts (+ its
              *.domain-service.test.ts): stateless domain logic that spans subdomains
              (ADR-0023), the one domain location allowed to compose more than one subdomain.
              Logic an aggregate owns belongs on that aggregate's *.root-ops.ts in its subdomain
              folder.
            # The one domain folder allowed to reach across subdomains.
            imports: { allow: ["@/modules/{module}/domain/**"] }
            children:
              "*.domain-service.ts":
                message: >-
                  A domain service is real domain logic (ADR-0023), so it needs a sibling
                  *.domain-service.test.ts.
                requires: ["{base}.test.ts"]
              "*.test.ts": { use: server-unit-test-file }

          "ports/":
            message: >-
              domain/ports/ is a container: it admits only the tier subfolders clients/
              (adapters to true third-party systems) and acl/ (anti-corruption ports to other
              bounded contexts) — ADR-0022. No files live directly in ports/. A repository port
              is not here either: it lives inside its own subdomain folder as
              domain/<subdomain>/*.repository.ts.
            # A port speaks the module's own domain vocabulary: the errors it may
            # fail with and the value objects it exchanges, from any subdomain.
            imports: { allow: ["@/modules/{module}/domain/**"] }
            children:
              "clients/":
                message: >-
                  domain/ports/clients/ holds one *.client.ts per third-party system this module
                  talks to (ADR-0022).
                children:
                  "*.client.ts":
                    message: >-
                      Every client port (*.client.ts) needs a *.client-live.ts, a
                      *.client-fake.ts, and a *.client-live.test.ts in
                      ../../../infrastructure/clients/. (A self-contained client with no port
                      lives directly in infrastructure/clients/ as *.client.ts and is not
                      required here.)
                    surface: [{ use: port-declares-no-value }]
                    requires:
                      - "../../../infrastructure/clients/{base}-live.ts"
                      - "../../../infrastructure/clients/{base}-fake.ts"
                      - "../../../infrastructure/clients/{base}-live.test.ts"
                    importedBy: { use: port-consumers }

              "acl/":
                message: >-
                  domain/ports/acl/ holds one *.acl.ts per other bounded context this module
                  needs an answer from (ADR-0022).
                children:
                  "*.acl.ts":
                    message: >-
                      Every ACL port (*.acl.ts) needs a *.acl-live.ts, a *.acl-fake.ts, and a
                      *.acl-live.test.ts in ../../../infrastructure/acl/.
                    surface: [{ use: port-declares-no-value }]
                    requires:
                      - "../../../infrastructure/acl/{base}-live.ts"
                      - "../../../infrastructure/acl/{base}-fake.ts"
                      - "../../../infrastructure/acl/{base}-live.test.ts"
                    importedBy: { use: acl-port-consumers }

          # Each subdomain folder — one per aggregate. The named folders above
          # are matched first, so this catch-all is only ever a subdomain.
          "{subdomain}/":
            message: >-
              A subdomain folder under domain/ admits its DDD stereotypes: *.root.ts (dumb data)
              + *.root-ops.ts, *.aggregate.ts / *.entity.ts / *.value-object.ts + their *-ops.ts
              bags, *.id.ts, *.errors.ts, *.events.ts, *.specification.ts, the subdomain's
              *.repository.ts port, and a value-objects/ subfolder. A free-standing helper is a
              smell — model it as an op or a *.specification.ts. Domain services do NOT live
              here (they span subdomains → domain/domain-services/); clients/acl ports live in
              domain/ports/.

            # Subdomain isolation, as the narrowing it actually is: a subdomain
            # sees itself, and what domain/ already allowed.
            imports:
              message: >-
                Within a module's domain, each subdomain folder is a boundary: it may import
                only its own subdomain, plus zod, oxide, platform/ddd/contracts and
                platform/ids. It may NOT import another subdomain, domain/domain-services/, or
                domain/ports/. Cross-subdomain composition is the job of a domain service in
                domain/domain-services/.
              allow: ["@/modules/{module}/domain/{subdomain}/**"]

            children:
              # A subdomain folder is the aggregate, so its root carries the
              # folder's own name: todo/ holds todo.root.ts. A root named
              # anything else means the folder holds two aggregates, or the
              # wrong one.
              "*.root.ts":
                name: { like: "{subdomain}" }
              "*.root-ops.ts":
                message: >-
                  An aggregate root's operations bag (*.root-ops.ts) owns the invariants, so it
                  carries the test-parity obligation: add the sibling *.root-ops.test.ts. (The
                  *.root.ts data schema is a dumb zod object and needs no test.)
                requires: ["{base}.test.ts"]
                importedBy:
                  message: >-
                    ADR-0003: *.root-ops.ts is the aggregate's mutation surface — the one op
                    stereotype that escapes the domain. It may be imported only by the module's
                    own command handlers (commands/*.handler.ts), its own domain/ (invariant
                    guards and sub-op composition), tests, and repository fakes (a test seam). A
                    query, event adapter, interface endpoint, or infrastructure Live reaching
                    for root-ops is bypassing the command boundary — dispatch a command instead,
                    or (for a read predicate) use a *.specification.ts.
                  allow:
                    - "@/modules/*/domain/**"
                    - "@/modules/*/commands/*.handler.ts"
                    - "**/*.test.ts"
                    - "**/*.repository-fake.ts"
              "*.aggregate.ts": {}
              "*.entity.ts": {}
              "*.value-object.ts": {}
              "*.aggregate-ops.ts | *.entity-ops.ts | *.value-object-ops.ts":
                use: constituent-ops
              "*.id.ts": {}
              "*.errors.ts": {}
              "*.events.ts": {}
              "*.specification.ts": { use: specification }
              "*.repository.ts":
                message: >-
                  Every repository port (*.repository.ts) needs its infrastructure trio: a
                  *.repository-live.ts, a *.repository-fake.ts, and a
                  *.repository-live.integration.test.ts in ../../infrastructure/repositories/.
                surface: [{ use: port-declares-no-value }]
                requires:
                  - "../../infrastructure/repositories/{base}-live.ts"
                  - "../../infrastructure/repositories/{base}-fake.ts"
                  - "../../infrastructure/repositories/{base}-live.integration.test.ts"
                importedBy:
                  message: >-
                    An outbound port is consumed by the module's own use cases, the @Module()
                    that binds its adapter, and the infrastructure adapter that implements it —
                    nothing else. A policy, an endpoint or another module reaching for one is
                    bypassing the use-case boundary: dispatch a command or query instead.
                  allow:
                    - "@/modules/*/domain/**"
                    - "@/modules/*/commands/**"
                    - "@/modules/*/queries/**"
                    - "@/modules/*/event-handlers/**"
                    - "@/modules/*/sagas/**"
                    - "@/modules/*/infrastructure/**"
                    - "@/modules/*/*.module.ts"
                    - "@/test-utils/**"
                    - "**/*.test.ts"
                # Both halves of the dumb-persistence vocabulary, each with the
                # advice that fits its half. The probes are written in the
                # one shape a port could take that a synthetic probe never
                # meets a parser over: an intersection, whose own members
                # the rule must still read under the alias's name.
                members:
                  - message: >-
                      Repository port method "{name}" is not in the dumb-persistence vocabulary
                      (ADR-0005). A read is only findOne/findMany taking a Specification — turn
                      this lookup or variant into a Specification the caller composes (e.g.
                      repo.findOne(XSpecifications.withId(id))), so the rule lives in one place
                      and the fake filters with the same object the live query uses. There are
                      no keyed or variant finders.
                    subject: members
                    declares: [type, interface, class]
                    in: "*Repository*"
                    match: "find*"
                    allow: [findOne, findMany]
                    probe:
                      source: "export type ZzRepositoryShape = ZzBase & { readonly findOneByEmail: () => void };"
                      name: findOneByEmail
                  - message: >-
                      Repository port method "{name}" is not in the dumb-persistence vocabulary
                      (ADR-0005). It reads like a domain verb — put that behaviour on the
                      aggregate and have the use case persist the result. A port declares only
                      insertOne/insertMany, updateOne/updateMany, deleteOne/deleteMany,
                      upsertOne/upsertMany, and findOne/findMany.
                    subject: members
                    declares: [type, interface, class]
                    in: "*Repository*"
                    matchNot: "find*"
                    allow:
                      - insertOne
                      - insertMany
                      - updateOne
                      - updateMany
                      - deleteOne
                      - deleteMany
                      - upsertOne
                      - upsertMany
                    probe:
                      source: "export type ZzRepositoryShape = ZzBase & { readonly activate: () => void };"
                      name: activate
              "*.test.ts": { use: server-unit-test-file }

              "value-objects/":
                message: >-
                  A value-objects/ folder under a subdomain admits *.value-object.ts, its
                  *.value-object-ops.ts bag, *.specification.ts, and tests.
                children:
                  "*.value-object.ts": {}
                  "*.value-object-ops.ts": { use: constituent-ops }
                  "*.specification.ts": { use: specification }
                  "*.test.ts": { use: server-unit-test-file }

  # ── test-utils/ ───────────────────────────────────────────────────────
  # The second composition root: it builds the whole application from the
  # same AppModule main.ts does, with the auth guard, the mailer and billing's
  # gateway swapped. It therefore names modules by their platform surfaces and
  # the platform kernel — the one place outside platform/ allowed to, because
  # it IS a composition root.
  "test-utils/":
    message: >-
      test-utils/ holds the server test harness: the composed test server, the fakes it swaps
      in, and the database helpers. A file here is a harness, not a feature — feature code
      belongs in a module.
    imports:
      reset: true
      message: >-
        The test harness composes the application, so it names module platform surfaces, the
        platform kernel, Nest's testing module and the typed client it hands to tests. It must
        not reach past a module's platform surface into its internals — the harness is a
        consumer of the published surface like any other.
      external:
        - vitest
        - oxide.ts
        - openapi-fetch
        - reflect-metadata
        - "@nestjs/common"
        - "@nestjs/testing"
      allow:
        - "@/common/**"
        - "@/platform/**"
        - "@/modules/*/*.platform.ts"
        - "@/test-utils/**"
        - "~/contracts/**"
        - "~/database/**"
    children:
      # A harness file is a fake, a test-something, a runtime, the setup file
      # or the global setup. Anything else is feature code that has drifted here.
      "fake-*.ts | *-fake.ts": {}
      "test-*.ts": {}
      "*-test-runtime.ts": {}
      "setup.ts": {}
      "global-setup.ts": {}
      "*.test.ts": { use: server-unit-test-file }
